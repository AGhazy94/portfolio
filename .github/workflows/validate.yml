name: Validate

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and formatting
        run: npm run validate

      # Renders every endpoint (OG image, icons, llms.txt), so a broken generator fails here.
      - name: Build
        run: npm run build
